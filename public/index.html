<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We're Getting Married!</title>
<meta name="description" content="Will & Riley are getting married. Ohio. Details coming soon.">
<meta property="og:title" content="WE'RE GETTING MARRIED">
<meta property="og:description" content="Will & Riley · Ohio · details coming soon">
<meta property="og:image" content="https://willandrigetmarried.com/og-dock.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="628">
<meta property="og:url" content="https://willandrigetmarried.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://willandrigetmarried.com/og-dock.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff3fa4;
    --yellow: #ffe234;
    --cyan: #3ee7ff;
    --lime: #b6ff3c;
    --ink: #120a1f;
    --tile-h: 31vh;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; overflow: hidden; font-family: "Bricolage Grotesque", system-ui, sans-serif; }

  /* ---------- moving photo wall ---------- */
  #wall {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center; gap: var(--gap);
    padding: var(--gap) 0;
  }
  .row { display: flex; gap: var(--gap); width: max-content; will-change: transform; }
  .row.ltr { animation: slideL var(--dur) linear infinite; }
  .row.rtl { animation: slideR var(--dur) linear infinite; }
  @keyframes slideL { from { transform: translate3d(0,0,0);} to { transform: translate3d(-50%,0,0);} }
  @keyframes slideR { from { transform: translate3d(-50%,0,0);} to { transform: translate3d(0,0,0);} }
  .tile {
    height: var(--tile-h); flex: none; border-radius: 14px; overflow: hidden;
    cursor: zoom-in; position: relative; background: #2a1a3d;
    transform: rotate(var(--tilt, 0deg)); transition: transform .25s ease, box-shadow .25s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .tile img { height: 100%; width: auto; display: block; object-fit: cover; }
  .tile:hover { transform: rotate(0deg) scale(1.06); z-index: 3; box-shadow: 0 0 0 5px var(--yellow), 0 16px 40px rgba(0,0,0,.6); }

  /* dark wash so the headline pops */
  #wash { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(18,10,31,.55) 0%, rgba(18,10,31,.25) 45%, rgba(18,10,31,0) 75%); }

  /* ---------- headline ---------- */
  #hero {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; padding: 0 4vw;
  }
  #hero > * { pointer-events: auto; }
  h1 {
    font-family: "Archivo Black", Impact, sans-serif; margin: 0; line-height: .9; text-transform: uppercase;
    font-size: clamp(3.2rem, 13vw, 12.5rem); letter-spacing: -.02em; cursor: pointer; user-select: none;
    color: var(--yellow);
    -webkit-text-stroke: 0.035em var(--ink);
    paint-order: stroke fill;
    text-shadow:
      0.06em 0.06em 0 var(--pink),
      0.12em 0.12em 0 var(--ink),
      0 0 40px rgba(0,0,0,.5);
    transform: rotate(-4deg);
    animation: wobble 3.2s ease-in-out infinite;
  }
  h1 span { display: block; }
  h1 .l2 { color: var(--cyan); transform: rotate(3deg) translateX(.06em); }
  h1 .l3 { color: var(--pink); text-shadow: 0.06em 0.06em 0 var(--yellow), 0.12em 0.12em 0 var(--ink), 0 0 40px rgba(0,0,0,.5); }
  h1 span { display: block; }
  @keyframes wobble { 0%,100% { transform: rotate(-4deg) scale(1);} 50% { transform: rotate(-2deg) scale(1.03);} }
  h1:active { animation: none; transform: rotate(-4deg) scale(.97); }

  #sub {
    margin-top: clamp(14px, 3vh, 34px); display: inline-block;
    font-weight: 800; font-size: clamp(1rem, 2.4vw, 1.6rem); letter-spacing: .04em; text-transform: uppercase;
    background: var(--lime); color: var(--ink); padding: .55em 1.2em; border-radius: 999px;
    border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); transform: rotate(2deg);
  }
  #subrow { display: inline-flex; align-items: flex-end; position: relative; }
  #bottle {
    all: unset; cursor: pointer; position: relative; width: 40px; height: 120px; display: block; z-index: 2;
    margin-left: -18px; margin-bottom: -6px;
    --tilt: -22deg; --s: 1.6; --shake: 0;
    transform: rotate(var(--tilt)) scale(var(--s)); transform-origin: 50% 88%;
    filter: drop-shadow(4px 4px 0 var(--ink)); -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none;
  }
  #bottle.holding { animation: shake .11s linear infinite; }
  @keyframes shake {
    0%   { transform: rotate(calc(var(--tilt) - var(--shake) * 10deg)) scale(calc(var(--s) + var(--shake) * .1)) translate(calc(var(--shake) * -4px), 0); }
    50%  { transform: rotate(calc(var(--tilt) + var(--shake) * 10deg)) scale(calc(var(--s) + var(--shake) * .1)) translate(calc(var(--shake) * 4px), calc(var(--shake) * -3px)); }
    100% { transform: rotate(calc(var(--tilt) - var(--shake) * 10deg)) scale(calc(var(--s) + var(--shake) * .1)) translate(calc(var(--shake) * -4px), 0); }
  }
  #bottle.popped { animation: recoil .5s cubic-bezier(.2,1.5,.4,1); }
  @keyframes recoil {
    0%   { transform: rotate(var(--tilt)) scale(var(--s)); }
    30%  { transform: rotate(calc(var(--tilt) - 16deg)) scale(calc(var(--s) * 1.06)) translateY(8px); }
    100% { transform: rotate(var(--tilt)) scale(var(--s)); }
  }
  #cork { transform-box: fill-box; transform-origin: center; }
  #bottle.popped #cork { animation: corkfly 1.1s cubic-bezier(.15,.8,.3,1) forwards; }
  @keyframes corkfly { to { transform: translate(-70px, -220px) rotate(-720deg); opacity: 0; } }
  #bottle.reset #cork { animation: none; transform: none; opacity: 1; }
  #fuse { position: absolute; left: 50%; bottom: -12px; width: 44px; height: 5px; transform: translateX(-50%);
    background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; opacity: 0; transition: opacity .2s; }
  #fuse::after { content: ""; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--yellow); }
  #bottle.holding #fuse { opacity: 1; }
  @media (max-width: 700px) { #bottle { --s: 1.15; margin-left: -12px; } }
  #hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-weight: 500; font-size: .85rem; color: rgba(255,255,255,.7); pointer-events: none; }

  /* ---------- lightbox ---------- */
  #lb { position: fixed; inset: 0; background: rgba(8,4,16,.86); backdrop-filter: blur(6px);
    display: none; place-items: center; z-index: 50; cursor: zoom-out; }
  #lb.open { display: grid; }
  #lb figure { margin: 0; max-width: 92vw; max-height: 88vh; cursor: default;
    transform: rotate(-1.5deg); animation: pop .28s cubic-bezier(.2,1.4,.4,1); }
  #lb img { max-width: 92vw; max-height: 88vh; display: block; border-radius: 16px;
    border: 8px solid #fff; box-shadow: 14px 14px 0 var(--pink), 0 30px 80px rgba(0,0,0,.7); background: #222; }
  @keyframes pop { from { transform: rotate(-6deg) scale(.6); opacity: 0;} to { transform: rotate(-1.5deg) scale(1); opacity: 1;} }
  .lbbtn { position: fixed; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%;
    border: 4px solid var(--ink); background: var(--yellow); color: var(--ink); font-size: 28px; font-weight: 900;
    cursor: pointer; display: grid; place-items: center; box-shadow: 4px 4px 0 var(--ink); user-select: none; }
  .lbbtn:hover { background: var(--lime); }
  #prev { left: 18px; } #next { right: 18px; }
  #close { position: fixed; top: 18px; right: 18px; transform: none; }
  @media (max-width: 700px) {
    :root { --tile-h: 22vh; --gap: 7px; }
    h1 { font-size: 17vw; }
    .lbbtn { width: 44px; height: 44px; font-size: 22px; }
    #prev { left: 8px; } #next { right: 8px; } #close { top: 10px; right: 10px; }
    #lb img { border-width: 5px; box-shadow: 8px 8px 0 var(--pink); }
  }

  /* ---------- confetti ---------- */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  @media (prefers-reduced-motion: reduce) { .row { animation-duration: 400s !important; } h1 { animation: none; } }
</style>
</head>
<body>

<div id="wall" aria-hidden="true"></div>
<div id="wash"></div>

<main id="hero">
  <div>
    <h1 id="title" title="click me">
      <span class="l1">We're</span>
      <span class="l2">Getting</span>
      <span class="l3">Married</span>
    </h1>
    <div id="subrow">
      <div id="sub">Ohio &nbsp;·&nbsp; details coming soon</div>
      <button id="bottle" aria-label="Press and hold to pop the champagne" title="press &amp; hold…">
        <svg viewBox="0 0 40 120" width="40" height="120" aria-hidden="true">
          <defs>
            <linearGradient id="glass" x1="0" x2="1">
              <stop offset="0" stop-color="#1f5a3a"/><stop offset=".45" stop-color="#3f9a63"/><stop offset="1" stop-color="#174430"/>
            </linearGradient>
            <linearGradient id="foil" x1="0" x2="1">
              <stop offset="0" stop-color="#c9971c"/><stop offset=".5" stop-color="#ffe27a"/><stop offset="1" stop-color="#b8860b"/>
            </linearGradient>
          </defs>
          <g id="cork">
            <rect x="14" y="2" width="12" height="14" rx="4" fill="#d9a066" stroke="#120a1f" stroke-width="2"/>
            <rect x="12" y="12" width="16" height="6" rx="2" fill="url(#foil)" stroke="#120a1f" stroke-width="2"/>
          </g>
          <path id="body" d="M15 18 h10 v22 c0 6 9 9 9 20 v52 a6 6 0 0 1 -6 6 h-16 a6 6 0 0 1 -6 -6 v-52 c0 -11 9 -14 9 -20 z"
                fill="url(#glass)" stroke="#120a1f" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M15 18 h10 v14 h-10 z" fill="url(#foil)" stroke="#120a1f" stroke-width="2"/>
          <rect x="9" y="70" width="22" height="26" rx="3" fill="#fff7d6" stroke="#120a1f" stroke-width="2"/>
          <text x="20" y="81" text-anchor="middle" font-family="Archivo Black, Impact, sans-serif" font-size="7" fill="#120a1f">W+R</text>
          <text x="20" y="91" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="6" fill="#ff3fa4">BRUT</text>
          <path d="M14 42 v50" stroke="rgba(255,255,255,.35)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span id="fuse"></span>
      </button>
    </div>
  </div>
</main>
<div id="hint">tap any photo · esc to go back</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo">
  <figure><img id="lbimg" alt="Will and Riley"></figure>
  <div class="lbbtn" id="prev" title="Previous">‹</div>
  <div class="lbbtn" id="next" title="Next">›</div>
  <div class="lbbtn" id="close" title="Close (Esc)">×</div>
</div>

<canvas id="confetti"></canvas>

<script>
(async () => {
  let photos = [];
  try { photos = await (await fetch('photos.json')).json(); } catch (e) { console.warn('photos.json not reachable (open via a web server, not file://)', e); }
  // shuffle once per load so the wall is different every visit
  for (let i = photos.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [photos[i], photos[j]] = [photos[j], photos[i]]; }

  const wall = document.getElementById('wall');
  const rowsWanted = Math.max(2, Math.floor(window.innerHeight / (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-h')) / 100 * window.innerHeight + 10)));
  const perRow = Math.ceil(photos.length / rowsWanted);

  // Build rows. Each row's content is duplicated so a -50% translate loops seamlessly.
  for (let r = 0; r < rowsWanted && photos.length; r++) {
    const slice = photos.slice(r * perRow, (r + 1) * perRow);
    if (!slice.length) break;
    const row = document.createElement('div');
    row.className = 'row ' + (r % 2 ? 'rtl' : 'ltr');
    row.style.setProperty('--dur', (70 + r * 18 + slice.length * 2) + 's');
    const makeTiles = () => slice.map((p) => {
      const t = document.createElement('div');
      t.className = 'tile';
      t.style.setProperty('--tilt', ((Math.random() * 4) - 2).toFixed(1) + 'deg');
      const img = document.createElement('img');
      img.src = `photos/${p.id}-grid.jpg`; img.loading = 'eager'; img.decoding = 'async'; img.alt = '';
      img.width = p.w; img.height = p.h;
      t.appendChild(img);
      t.addEventListener('click', () => open(photos.indexOf(p)));
      return t;
    });
    // The "unit" must be wider than the viewport so the loop never shows a gap; the unit is then
    // appended twice and the row slides by exactly 50% (one unit) for a seamless loop.
    const tileH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-h')) / 100 * window.innerHeight;
    const unitW = slice.reduce((s, p) => s + (p.w / p.h) * tileH + 10, 0);
    const copies = Math.max(1, Math.ceil((window.innerWidth * 1.2) / unitW));
    for (let c = 0; c < copies * 2; c++) makeTiles().forEach(t => row.appendChild(t));
    wall.appendChild(row);
  }

  // ---------- lightbox ----------
  const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
  let cur = -1;
  function show(i) {
    cur = (i + photos.length) % photos.length;
    lbimg.src = `photos/${photos[cur].id}-full.jpg`;
    // preload neighbours
    [1, -1].forEach(d => { const im = new Image(); im.src = `photos/${photos[(cur + d + photos.length) % photos.length].id}-full.jpg`; });
  }
  function open(i) { show(i); lb.classList.add('open'); burst(0.5, 0.5, 40); }
  function close() { lb.classList.remove('open'); cur = -1; }
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.tagName === 'FIGURE') close(); });
  document.getElementById('close').addEventListener('click', close);
  document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); show(cur - 1); });
  document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); show(cur + 1); });
  addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  // swipe on mobile
  let sx = null;
  lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); });

  // ---------- confetti (Raycast-style: small, dense, floaty) ----------
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const colors = ['#ff3fa4', '#ffe234', '#3ee7ff', '#b6ff3c', '#ff7a3d', '#a78bfa', '#ffffff'];
  let parts = [], raf = 0;
  function size() {
    const d = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  size(); addEventListener('resize', size);
  // x,y in px. angle in radians (0 = right, -PI/2 = up). spread in radians.
  function spray(x, y, n, angle, spread, power, palette, round) {
    const pal = palette || colors;
    for (let i = 0; i < n; i++) {
      const a = angle + (Math.random() - .5) * spread;
      const v = power * (0.45 + Math.random() * 0.75);
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, round,
        w: 3 + Math.random() * 4, h: 5 + Math.random() * 6,
        c: pal[Math.random() * pal.length | 0],
        r: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * .25,
        t: Math.random() * Math.PI * 2, // tumble phase (fakes 3D flip)
        vt: .12 + Math.random() * .18,
        sway: 1 + Math.random() * 2, phase: Math.random() * Math.PI * 2,
        life: 220 + Math.random() * 120
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burst(fx, fy, n) { spray(fx * innerWidth, fy * innerHeight, n, -Math.PI / 2, Math.PI * 2, 9); }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life-- > 0 && p.y < innerHeight + 30);
    for (const p of parts) {
      p.vy += 0.10;            // light gravity
      p.vx *= 0.975; p.vy *= 0.975;   // air drag -> slows quickly, then floats
      p.phase += 0.06;
      p.x += p.vx + Math.sin(p.phase) * p.sway * 0.35;
      p.y += p.vy;
      p.r += p.vr; p.t += p.vt;
      const flip = Math.cos(p.t);     // -1..1 -> squish on one axis = tumbling card
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.max(0.15, Math.abs(flip)));
      ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.min(1, p.life / 60);
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function cannons() {
    const W = innerWidth, H = innerHeight;
    // two cannons anchored at the literal bottom corners, aimed up and across
    spray(0, H, 260, -Math.PI * 0.32, Math.PI * 0.30, 30);   // bottom-left  -> up-right
    spray(W, H, 260, -Math.PI * 0.68, Math.PI * 0.30, 30);   // bottom-right -> up-left
  }
  document.getElementById('title').addEventListener('click', cannons);

  // ---------- champagne: press & hold 3s to pop ----------
  const bottle = document.getElementById('bottle'), cork = document.getElementById('cork');
  const HOLD = 3000; let holdStart = 0, holdRaf = 0, popped = false;
  function holdTick() {
    const p = Math.min(1, (performance.now() - holdStart) / HOLD);
    bottle.style.setProperty('--p', p); bottle.style.setProperty('--shake', (p * p).toFixed(3));
    if (p >= 1) return pop();
    holdRaf = requestAnimationFrame(holdTick);
  }
  function startHold(e) {
    if (popped) return; e.preventDefault();
    holdStart = performance.now(); bottle.classList.add('holding'); bottle.classList.remove('reset');
    holdRaf = requestAnimationFrame(holdTick);
  }
  function cancelHold() {
    cancelAnimationFrame(holdRaf); bottle.classList.remove('holding');
    bottle.style.setProperty('--p', 0); bottle.style.setProperty('--shake', 0);
  }
  function pop() {
    cancelHold(); popped = true; bottle.classList.add('popped');
    const r = cork.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    // bottle is tilted -22deg, so the neck points up and to the left
    const fizz = ['#ffffff', '#fff7d6', '#ffe27a', '#ffd23f'], dir = -Math.PI * 0.62;
    spray(x, y, 160, dir, Math.PI * 0.30, 30, fizz, true);                       // main jet
    setTimeout(() => spray(x, y, 110, dir, Math.PI * 0.45, 18, fizz, true), 100); // foam
    setTimeout(() => spray(x, y, 70, dir, Math.PI * 0.6, 9, fizz, true), 260);    // dribble
    if (navigator.vibrate) navigator.vibrate([30, 40, 80]);
    setTimeout(() => { bottle.classList.remove('popped'); bottle.classList.add('reset'); popped = false; }, 4000);
  }
  bottle.addEventListener('pointerdown', startHold);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => bottle.addEventListener(ev, cancelHold));
  bottle.addEventListener('contextmenu', e => e.preventDefault());
  setTimeout(() => burst(0.5, 0.35, 120), 600); // welcome pop
})();
</script>
</body>
</html>
