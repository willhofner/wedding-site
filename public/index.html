<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We're Getting Married!</title>
<meta name="description" content="Will & Riley are getting married. Ohio, 2027. Details coming soon.">
<meta property="og:title" content="WE'RE GETTING MARRIED">
<meta property="og:description" content="Will & Riley · Ohio, 2027 · details coming soon">
<meta property="og:image" content="/photos/p18-full.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff3fa4;
    --yellow: #ffe234;
    --cyan: #3ee7ff;
    --lime: #b6ff3c;
    --ink: #120a1f;
    --tile-h: 31vh;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #fff; overflow: hidden; font-family: "Bricolage Grotesque", system-ui, sans-serif; }

  /* ---------- moving photo wall ---------- */
  #wall {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: center; gap: var(--gap);
    padding: var(--gap) 0;
  }
  .row { display: flex; gap: var(--gap); width: max-content; will-change: transform; }
  .row.ltr { animation: slideL var(--dur) linear infinite; }
  .row.rtl { animation: slideR var(--dur) linear infinite; }
  @keyframes slideL { from { transform: translate3d(0,0,0);} to { transform: translate3d(-50%,0,0);} }
  @keyframes slideR { from { transform: translate3d(-50%,0,0);} to { transform: translate3d(0,0,0);} }
  .tile {
    height: var(--tile-h); flex: none; border-radius: 14px; overflow: hidden;
    cursor: zoom-in; position: relative; background: #2a1a3d;
    transform: rotate(var(--tilt, 0deg)); transition: transform .25s ease, box-shadow .25s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .tile img { height: 100%; width: auto; display: block; object-fit: cover; }
  .tile:hover { transform: rotate(0deg) scale(1.06); z-index: 3; box-shadow: 0 0 0 5px var(--yellow), 0 16px 40px rgba(0,0,0,.6); }

  /* dark wash so the headline pops */
  #wash { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(18,10,31,.55) 0%, rgba(18,10,31,.25) 45%, rgba(18,10,31,0) 75%); }

  /* ---------- headline ---------- */
  #hero {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; padding: 0 4vw;
  }
  #hero > * { pointer-events: auto; }
  h1 {
    font-family: "Archivo Black", Impact, sans-serif; margin: 0; line-height: .9; text-transform: uppercase;
    font-size: clamp(3.2rem, 13vw, 12.5rem); letter-spacing: -.02em; cursor: pointer; user-select: none;
    color: var(--yellow);
    -webkit-text-stroke: 0.035em var(--ink);
    paint-order: stroke fill;
    text-shadow:
      0.06em 0.06em 0 var(--pink),
      0.12em 0.12em 0 var(--ink),
      0 0 40px rgba(0,0,0,.5);
    transform: rotate(-4deg);
    animation: wobble 3.2s ease-in-out infinite;
  }
  h1 span { display: block; }
  h1 .l2 { color: var(--cyan); transform: rotate(3deg) translateX(.06em); }
  h1 .l3 { color: var(--pink); text-shadow: 0.06em 0.06em 0 var(--yellow), 0.12em 0.12em 0 var(--ink), 0 0 40px rgba(0,0,0,.5); }
  h1 span { display: block; }
  @keyframes wobble { 0%,100% { transform: rotate(-4deg) scale(1);} 50% { transform: rotate(-2deg) scale(1.03);} }
  h1:active { animation: none; transform: rotate(-4deg) scale(.97); }

  #sub {
    margin-top: clamp(14px, 3vh, 34px); display: inline-block;
    font-weight: 800; font-size: clamp(1rem, 2.4vw, 1.6rem); letter-spacing: .04em; text-transform: uppercase;
    background: var(--lime); color: var(--ink); padding: .55em 1.2em; border-radius: 999px;
    border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); transform: rotate(2deg);
  }
  #hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-weight: 500; font-size: .85rem; color: rgba(255,255,255,.7); pointer-events: none; }

  /* ---------- lightbox ---------- */
  #lb { position: fixed; inset: 0; background: rgba(8,4,16,.86); backdrop-filter: blur(6px);
    display: none; place-items: center; z-index: 50; cursor: zoom-out; }
  #lb.open { display: grid; }
  #lb figure { margin: 0; max-width: 92vw; max-height: 88vh; cursor: default;
    transform: rotate(-1.5deg); animation: pop .28s cubic-bezier(.2,1.4,.4,1); }
  #lb img { max-width: 92vw; max-height: 88vh; display: block; border-radius: 16px;
    border: 8px solid #fff; box-shadow: 14px 14px 0 var(--pink), 0 30px 80px rgba(0,0,0,.7); background: #222; }
  @keyframes pop { from { transform: rotate(-6deg) scale(.6); opacity: 0;} to { transform: rotate(-1.5deg) scale(1); opacity: 1;} }
  .lbbtn { position: fixed; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%;
    border: 4px solid var(--ink); background: var(--yellow); color: var(--ink); font-size: 28px; font-weight: 900;
    cursor: pointer; display: grid; place-items: center; box-shadow: 4px 4px 0 var(--ink); user-select: none; }
  .lbbtn:hover { background: var(--lime); }
  #prev { left: 18px; } #next { right: 18px; }
  #close { position: fixed; top: 18px; right: 18px; transform: none; }
  @media (max-width: 700px) {
    :root { --tile-h: 22vh; --gap: 7px; }
    h1 { font-size: 17vw; }
    .lbbtn { width: 44px; height: 44px; font-size: 22px; }
    #prev { left: 8px; } #next { right: 8px; } #close { top: 10px; right: 10px; }
    #lb img { border-width: 5px; box-shadow: 8px 8px 0 var(--pink); }
  }

  /* ---------- confetti ---------- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }

  @media (prefers-reduced-motion: reduce) { .row { animation-duration: 400s !important; } h1 { animation: none; } }
</style>
</head>
<body>

<div id="wall" aria-hidden="true"></div>
<div id="wash"></div>

<main id="hero">
  <div>
    <h1 id="title" title="click me">
      <span class="l1">We're</span>
      <span class="l2">Getting</span>
      <span class="l3">Married</span>
    </h1>
    <div id="sub">Ohio &nbsp;·&nbsp; 2027 &nbsp;·&nbsp; details coming soon</div>
  </div>
</main>
<div id="hint">tap any photo · esc to go back</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo">
  <figure><img id="lbimg" alt="Will and Riley"></figure>
  <div class="lbbtn" id="prev" title="Previous">‹</div>
  <div class="lbbtn" id="next" title="Next">›</div>
  <div class="lbbtn" id="close" title="Close (Esc)">×</div>
</div>

<canvas id="confetti"></canvas>

<script>
(async () => {
  const photos = await (await fetch('photos.json')).json();
  // shuffle once per load so the wall is different every visit
  for (let i = photos.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [photos[i], photos[j]] = [photos[j], photos[i]]; }

  const wall = document.getElementById('wall');
  const rowsWanted = Math.max(2, Math.floor(window.innerHeight / (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-h')) / 100 * window.innerHeight + 10)));
  const perRow = Math.ceil(photos.length / rowsWanted);

  // Build rows. Each row's content is duplicated so a -50% translate loops seamlessly.
  for (let r = 0; r < rowsWanted; r++) {
    const slice = photos.slice(r * perRow, (r + 1) * perRow);
    if (!slice.length) break;
    const row = document.createElement('div');
    row.className = 'row ' + (r % 2 ? 'rtl' : 'ltr');
    row.style.setProperty('--dur', (70 + r * 18 + slice.length * 2) + 's');
    const makeTiles = () => slice.map((p) => {
      const t = document.createElement('div');
      t.className = 'tile';
      t.style.setProperty('--tilt', ((Math.random() * 4) - 2).toFixed(1) + 'deg');
      const img = document.createElement('img');
      img.src = `photos/${p.id}-grid.jpg`; img.loading = 'eager'; img.decoding = 'async'; img.alt = '';
      img.width = p.w; img.height = p.h;
      t.appendChild(img);
      t.addEventListener('click', () => open(photos.indexOf(p)));
      return t;
    });
    // The "unit" must be wider than the viewport so the loop never shows a gap; the unit is then
    // appended twice and the row slides by exactly 50% (one unit) for a seamless loop.
    const tileH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-h')) / 100 * window.innerHeight;
    const unitW = slice.reduce((s, p) => s + (p.w / p.h) * tileH + 10, 0);
    const copies = Math.max(1, Math.ceil((window.innerWidth * 1.2) / unitW));
    for (let c = 0; c < copies * 2; c++) makeTiles().forEach(t => row.appendChild(t));
    wall.appendChild(row);
  }

  // ---------- lightbox ----------
  const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
  let cur = -1;
  function show(i) {
    cur = (i + photos.length) % photos.length;
    lbimg.src = `photos/${photos[cur].id}-full.jpg`;
    // preload neighbours
    [1, -1].forEach(d => { const im = new Image(); im.src = `photos/${photos[(cur + d + photos.length) % photos.length].id}-full.jpg`; });
  }
  function open(i) { show(i); lb.classList.add('open'); burst(0.5, 0.5, 40); }
  function close() { lb.classList.remove('open'); cur = -1; }
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.tagName === 'FIGURE') close(); });
  document.getElementById('close').addEventListener('click', close);
  document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); show(cur - 1); });
  document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); show(cur + 1); });
  addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  // swipe on mobile
  let sx = null;
  lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); });

  // ---------- confetti ----------
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const colors = ['#ff3fa4', '#ffe234', '#3ee7ff', '#b6ff3c', '#ffffff'];
  let parts = [];
  function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  size(); addEventListener('resize', size);
  function burst(fx, fy, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      parts.push({ x: fx * innerWidth, y: fy * innerHeight, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
        w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, c: colors[Math.random() * colors.length | 0],
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, life: 90 + Math.random() * 60 });
    }
    if (!raf) tick();
  }
  let raf = 0;
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life-- > 0 && p.y < innerHeight + 20);
    for (const p of parts) {
      p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.min(1, p.life / 30); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  document.getElementById('title').addEventListener('click', (e) => burst(e.clientX / innerWidth, e.clientY / innerHeight, 160));
  setTimeout(() => burst(0.5, 0.35, 120), 600); // welcome pop
})();
</script>
</body>
</html>
